name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Create environment files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > client/src/environments/environment.ts
          export const environment = {
            supabaseUrl: '$SUPABASE_URL',
            supabaseAnonKey: '$SUPABASE_ANON_KEY',
          };
          EOF
          cp client/src/environments/environment.ts client/src/environments/environment.development.ts

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build Angular app
        run: npm run build
        working-directory: client

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/ikigai-carta/browser/index.html dist/ikigai-carta/browser/404.html
        working-directory: client

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist/ikigai-carta/browser
          cname: ikigaimasajes.es
